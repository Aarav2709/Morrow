name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: npm test
      - run: npm run build
      # signing turns on by itself once these secrets exist in the repository settings. a missing secret
      # arrives as an empty string, which electron-builder would read as a certificate path, so only the
      # ones that are set are passed on
      - name: Pass on the signing secrets that exist
        shell: bash
        env:
          CSC_LINK: ${{ secrets.CSC_LINK }}
          CSC_KEY_PASSWORD: ${{ secrets.CSC_KEY_PASSWORD }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          for name in CSC_LINK CSC_KEY_PASSWORD APPLE_ID APPLE_APP_SPECIFIC_PASSWORD APPLE_TEAM_ID; do
            if [ -n "${!name}" ]; then echo "$name=${!name}" >> "$GITHUB_ENV"; fi
          done
          # without a certificate the mac app gets a free ad hoc signature, apple silicon refuses to open
          # an app with none at all and calls it damaged
          if [ -z "$CSC_LINK" ]; then echo "BUILDER_ARGS=-c.mac.identity=-" >> "$GITHUB_ENV"; fi
      - run: npx electron-builder --publish always ${{ env.BUILDER_ARGS }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
