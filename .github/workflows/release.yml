name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: read

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: npm test
      - run: npm run build
      # signing turns on by itself once these secrets exist in the repository settings. a missing secret
      # arrives as an empty string, which electron-builder would read as a certificate path, so only the
      # ones that are set are passed on
      - name: Pass on the signing secrets that exist
        shell: bash
        env:
          CSC_LINK: ${{ secrets.CSC_LINK }}
          CSC_KEY_PASSWORD: ${{ secrets.CSC_KEY_PASSWORD }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          for name in CSC_LINK CSC_KEY_PASSWORD APPLE_ID APPLE_APP_SPECIFIC_PASSWORD APPLE_TEAM_ID; do
            if [ -n "${!name}" ]; then echo "$name=${!name}" >> "$GITHUB_ENV"; fi
          done
          # without a certificate the mac app gets a free ad hoc signature, apple silicon refuses to open
          # an app with none at all and calls it damaged
          if [ -z "$CSC_LINK" ] && [ "$RUNNER_OS" = macOS ]; then
            echo "BUILDER_ARGS=--config.mac.identity=-" >> "$GITHUB_ENV"
          fi
      # bash on every system, powershell would split the option above at its dots.
      # windows builds each architecture on its own so nobody downloads an installer twice the size,
      # macos builds intel and apple silicon side by side from the apple silicon runner.
      # nothing is uploaded here: jobs creating the release at the same time raced each other and made
      # duplicate releases, so the release job below uploads everything once
      - name: Build
        shell: bash
        run: |
          case "$RUNNER_OS" in
            Windows)
              npx electron-builder --win --x64 --publish never $BUILDER_ARGS
              npx electron-builder --win --arm64 --publish never $BUILDER_ARGS
              ;;
            macOS)
              npx electron-builder --mac --publish never $BUILDER_ARGS
              ;;
            *)
              npx electron-builder --linux --publish never $BUILDER_ARGS
              ;;
          esac
      - uses: actions/upload-artifact@v4
        with:
          name: morrow-${{ runner.os }}
          if-no-files-found: error
          path: |
            release/Morrow-*.exe
            release/Morrow-*.dmg
            release/Morrow-*.zip
            release/Morrow-*.AppImage
            release/morrow_*.deb

  release:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: files
          merge-multiple: true
      # a draft, so the notes can be written before anyone sees it. a release made by hand beforehand is
      # used as it is, and files already on it are replaced
      - name: Upload to the release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ github.ref_name }}
        run: |
          ls -l files
          if ! gh release view "$TAG" > /dev/null 2>&1; then
            gh release create "$TAG" --draft --verify-tag --title "Morrow ${TAG#v}" --notes ""
          fi
          gh release upload "$TAG" files/* --clobber
